<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO -->
    <title>Best Hotel in Ooty | Budget & Luxury Stays | DrizzleDropinn</title>
    <meta name="description" content="Looking for the best hotel in Ooty? DrizzleDropinn offers stunning valley views, family-friendly budget stays, and luxury rooms. Book direct for the best rates!" />
    <meta name="keywords" content="Hotels in Ooty, Best hotel in Ooty, Ooty stay, Ooty resorts, Budget stay in Ooty, Luxury hotels in Ooty, DrizzleDrop Inn, hotel in Chennai, best hotel OMR Chennai" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="DrizzleDrop Hotels" />

    <!-- Open Graph -->
    <meta property="og:title" content="DrizzleDrop Hotels | Best Hotel in Ooty & Chennai" />
    <meta property="og:description" content="Premium hospitality at DrizzleDrop Inn – luxury stays in Chennai OMR and Ooty Nilgiris. Book your perfect getaway today." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.drizzledrop.com" />
    <meta property="og:site_name" content="DrizzleDrop Hotels" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DrizzleDrop Hotels | Best Hotel in Ooty & Chennai" />
    <meta name="twitter:description" content="Luxury hotel stays in Chennai OMR and Ooty Nilgiris. Book your perfect escape at DrizzleDrop Inn." />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.drizzledrop.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/src/assets/drilogo.png" />

    <!-- Preconnect for Google Fonts performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Organisation & Hotel JSON-LD (site-wide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Hotel",
      "name": "DrizzleDropinn",
      "description": "Premium budget and luxury hotel in Ooty offering stunning valley views and family-friendly rooms. Also featuring a premier business hotel in Chennai OMR.",
      "url": "https://www.drizzledrop.com",
      "logo": "https://www.drizzledrop.com/src/assets/drilogo.png",
      "image": "https://www.drizzledrop.com/src/assets/drilogo.png",
      "telephone": "+91-8667825086",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Ooty",
        "addressRegion": "Tamil Nadu",
        "postalCode": "643001",
        "addressCountry": "IN"
      },
      "priceRange": "₹2000 - ₹5000",
      "starRating": {
        "@type": "Rating",
        "ratingValue": "4"
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+91-8667825086",
          "contactType": "Reservations",
          "areaServed": "IN",
          "availableLanguage": ["English", "Tamil"]
        }
      ],
      "sameAs": [
        "https://www.facebook.com/drizzledropinn",
        "https://www.instagram.com/drizzledropinn"
      ]
    }
    </script>

    <!-- Breadcrumb JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.drizzledrop.com" },
        { "@type": "ListItem", "position": 2, "name": "Chennai", "item": "https://www.drizzledrop.com/chennai" },
        { "@type": "ListItem", "position": 3, "name": "Ooty", "item": "https://www.drizzledrop.com/ooty" }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
